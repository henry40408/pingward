# cargo-deny configuration — supply-chain checks for the dependency graph.
# Run locally with `cargo deny check`; CI runs the same on every push and PR.

[graph]
# Check the dependency graph for all targets, not just the host's, so a
# platform-specific dependency can't smuggle in a bad license or advisory.
all-features = true

[advisories]
version = 2
# Deny crates with a known security advisory (RUSTSEC) or that have been yanked.
# `ignore` holds advisory IDs we've reviewed and consciously accept.
yanked = "deny"
ignore = [
    # spin 0.9.8 is yanked but pulled in transitively via flume -> sqlx-sqlite;
    # we don't control the version and there is no non-yanked 0.9.x to move to.
    "spin@0.9.8",
    # rustls 0.23.45 advisories; fixed in 0.23.46 (published 2026-10-14 09:54
    # UTC), which is still inside our 168h dependency cooldown. Upgrade on or
    # after 2026-10-21 09:54 UTC and remove these ignores.
    # Reachability: 0347 (ECH) and 0348 (brotli feature, not in Cargo.lock) are
    # not used by this repo. 0346 (Debug of client session values) and 0349
    # (key-share downgrade via session store) are not assessed.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0347",
    "RUSTSEC-2026-0348",
    "RUSTSEC-2026-0349",
    # basic-toml is unmaintained; build-time only, via askama_derive 0.16.1
    # (latest), which still depends on it. Remove once askama drops it.
    # Tracked in #202.
    "RUSTSEC-2026-0374",
]

[licenses]
version = 2
# Permissive / public-domain-equivalent licenses only. Verify the active set
# with `cargo deny list`; add a license here only after reviewing the crate.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate transitive versions are common; surface them as a warning, not a
# hard failure.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io is trusted; an unknown registry or any git source is rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
