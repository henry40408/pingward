name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time. A newer push supersedes the run it interrupted;
# a tag does not — a tagged build publishes one specific version and nothing
# should quietly cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

# Every `uses:` is pinned to a full commit SHA, and the version comment names
# an exact release tag — never a floating major like `v2`. Dependabot works
# out what a SHA pin currently is by finding the tag that points at it, so a
# pin taken from a floating tag stops being recognisable the moment that tag
# moves on. Swatinem/rust-cache did exactly that: `v2` briefly sat on an
# untagged post-release changelog fixup, we pinned that commit, and once v2.9.2
# moved the tag away our pin matched no tag at all. Dependabot then stopped
# offering versions and started offering whatever master's HEAD happened to be
# that morning — an unreviewed, unreleased commit running with full job
# permissions, which is the opposite of what SHA pinning is for.

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.30.3
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Wait for mailpit
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/readyz && exit 0
            sleep 1
          done
          echo "mailpit did not become ready" >&2
          exit 1

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PINGWARD_TEST_SMTP_HOST: localhost
          PINGWARD_TEST_SMTP_PORT: "1025"
          PINGWARD_TEST_MAILPIT_API: http://localhost:8025
        run: cargo nextest run

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-deny@0.18.9

      - name: cargo deny check
        run: cargo deny check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.30.3
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-llvm-cov installs the llvm-tools-preview component itself, so the
      # toolchain needs no extra declaration beyond rust-toolchain.toml.

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-nextest

      - name: Wait for mailpit
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/readyz && exit 0
            sleep 1
          done
          echo "mailpit did not become ready" >&2
          exit 1

      - name: Generate coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PINGWARD_TEST_SMTP_HOST: localhost
          PINGWARD_TEST_SMTP_PORT: "1025"
          PINGWARD_TEST_MAILPIT_API: http://localhost:8025
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henry40408/pingward
          files: lcov.info
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  e2e-tests:
    name: e2e (cucumber)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Its own key, and both workspaces named: `e2e/` is deliberately outside
      # the root workspace, so its artefacts live in `e2e/target` and would
      # otherwise be invisible to the cache — and sharing a key with the
      # unit-test job would have the two evict each other.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e
          workspaces: |
            .
            e2e

      # The suite spawns this binary once per scenario; without this step the
      # first scenario would build it while the rest waited.
      - name: Build pingward
        run: cargo build

      # thirtyfour's driver manager downloads and supervises a matching
      # chromedriver itself, so nothing is installed here — but it downloads
      # only the *driver*. The browser is the runner image's own Google Chrome.
      - name: Cache chromedriver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/thirtyfour/drivers
          key: thirtyfour-drivers-${{ runner.os }}-${{ hashFiles('e2e/Cargo.lock') }}
          restore-keys: thirtyfour-drivers-${{ runner.os }}-

      # The root job's `--all` and `--all-targets` stop at the workspace
      # boundary, so the E2E crate's own lint set is only enforced here.
      - name: Check formatting
        working-directory: e2e
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: e2e
        run: cargo clippy --all-targets -- -D warnings

      # No sharding: cucumber runs the scenarios concurrently in one process,
      # sized to the runner's cores.
      - name: Run E2E tests
        working-directory: e2e
        run: cargo test --test e2e
