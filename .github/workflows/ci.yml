name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the older run of the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Pin every `uses:` to the commit SHA of an exact release tag (never a floating
# major like `v2`): Dependabot identifies a pin by the tag pointing at it, and a
# SHA no tag points at gets "updated" to unreleased branch HEADs.

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.30.3
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Wait for mailpit
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/readyz && exit 0
            sleep 1
          done
          echo "mailpit did not become ready" >&2
          exit 1

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PINGWARD_TEST_SMTP_HOST: localhost
          PINGWARD_TEST_SMTP_PORT: "1025"
          PINGWARD_TEST_MAILPIT_API: http://localhost:8025
        run: cargo nextest run

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-deny@0.18.9

      - name: cargo deny check
        run: cargo deny check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.30.3
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-llvm-cov installs llvm-tools-preview itself.

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-nextest

      - name: Wait for mailpit
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/readyz && exit 0
            sleep 1
          done
          echo "mailpit did not become ready" >&2
          exit 1

      - name: Generate coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PINGWARD_TEST_SMTP_HOST: localhost
          PINGWARD_TEST_SMTP_PORT: "1025"
          PINGWARD_TEST_MAILPIT_API: http://localhost:8025
        run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henry40408/pingward
          files: lcov.info
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  e2e-tests:
    name: e2e (cucumber)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Own key (so it doesn't evict the test job's cache) and both workspaces:
      # `e2e/` is a separate workspace with its own `e2e/target`.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e
          workspaces: |
            .
            e2e

      # Every scenario spawns this binary; build it once up front.
      - name: Build pingward
        run: cargo build

      # thirtyfour downloads chromedriver itself; the browser is the runner's Chrome.
      - name: Cache chromedriver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/thirtyfour/drivers
          key: thirtyfour-drivers-${{ runner.os }}-${{ hashFiles('e2e/Cargo.lock') }}
          restore-keys: thirtyfour-drivers-${{ runner.os }}-

      # The root job's fmt/clippy stop at the workspace boundary.
      - name: Check formatting
        working-directory: e2e
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: e2e
        run: cargo clippy --all-targets -- -D warnings

      # No sharding: cucumber runs scenarios concurrently, sized to the cores.
      - name: Run E2E tests
        working-directory: e2e
        run: cargo test --test e2e
