name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job writes to the repository; a job that needs more declares it itself.
permissions:
  contents: read

# A newer push cancels the older run of the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin every `uses:` to the commit SHA of an exact release tag (never a floating
# major like `v2`): Dependabot identifies a pin by the tag pointing at it, and a
# SHA no tag points at gets "updated" to unreleased branch HEADs.

jobs:
  # The licence allow-list below is enforced with go-licenses, the advisory
  # check with govulncheck.
  deps:
    name: deps
    runs-on: ubuntu-latest
    env:
      # The root module allows only these. `e2e/` additionally allows MPL-2.0
      # (godog pulls in go-immutable-radix, go-memdb and golang-lru); MPL-2.0
      # must not reach the root module, which ships in the image.
      ALLOWED_LICENSES: Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MIT-0,Zlib,Unlicense,CC0-1.0,Unicode-3.0,BSL-1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # go-licenses needs GOROOT set explicitly, else it fails on the standard
      # library with "does not have module info". The module's own LICENSE is
      # not a dependency, so it is ignored.
      - run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --include_tests --ignore github.com/henry40408/pingward \
            --allowed_licenses="$ALLOWED_LICENSES"
      # `e2e/` is a separate Go module with its own vendor directory.
      - run: go mod tidy -diff
        working-directory: e2e
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
        working-directory: e2e
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: e2e
      # `--include_tests` because the Gherkin and browser libraries are test
      # dependencies of this module.
      - run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --include_tests --ignore github.com/henry40408/pingward/e2e \
            --allowed_licenses="$ALLOWED_LICENSES,MPL-2.0"
        working-directory: e2e

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The action only installs the binary: it always runs `golangci-lint run`,
      # which cannot do `fmt`. No `version:` input, so the action picks the
      # linter release itself and dependabot only tracks the action.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-only: true
      - run: golangci-lint fmt --diff ./...
      - run: golangci-lint run ./...
      - run: golangci-lint fmt --diff ./...
        working-directory: e2e
      - run: golangci-lint run ./...
        working-directory: e2e
      # CI and the Dockerfile read the Go version from the root go.mod only, so
      # the nested module must not drift from it.
      - run: |
          root="$(grep -E '^(go|toolchain) ' go.mod)"
          nested="$(grep -E '^(go|toolchain) ' e2e/go.mod)"
          test "$root" = "$nested" || { echo "e2e/go.mod differs from go.mod:"; echo "$root"; echo "--"; echo "$nested"; exit 1; }

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.30.3
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Wait for mailpit
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8025/readyz && exit 0
            sleep 1
          done
          echo "mailpit did not become ready" >&2
          exit 1

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PINGWARD_TEST_SMTP_HOST: localhost
          PINGWARD_TEST_SMTP_PORT: "1025"
          PINGWARD_TEST_MAILPIT_API: http://localhost:8025
        run: go test -mod=vendor -race ./...

  # Pushes to main mutate the whole module, split into shards that run on their
  # own runners; pull requests mutate only the lines changed against the base
  # branch, in the same shards. The efficacy threshold and the `e2e/` and
  # `vendor/` exclusions live in `.gremlins.yaml`: gremlins v0.6.0 silently
  # ignores `--threshold-efficacy` on the command line, so the job could never
  # fail on a low score. The tests that need PostgreSQL or SMTP skip here (no
  # services), which gremlins counts as not covered.
  #
  # gremlins `unleash` takes one path, so every shard runs `.` and
  # `--exclude-files` drops the files outside its slice (RE2 has no lookahead,
  # so each entry lists the complement). `--exclude-files` replaces the list in
  # `.gremlins.yaml`, so `e2e/` and `vendor/` are repeated in every entry.
  # A NEW PACKAGE MUST BE ADDED BY HAND: put it in one shard's slice and in the
  # `exclude` list of every other shard except `rest`. `rest` excludes only the
  # other shards' packages, so a package nobody lists still runs there.
  # The shards are `store` (internal/store, internal/db), `rendering`
  # (internal/views, view, web, markdown, assets) and `rest` (everything else,
  # including `cmd/`).
  mutation-shard:
    name: mutation-shard (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: store
            exclude: '^(e2e|vendor|cmd)/|^internal/(api|apikey|assets|auth|config|cron|duration|elevate|events|ids|markdown|models|notify|ping|prune|ratelimit|safego|scheduler|secret|server|testutil|tz|version|view|views|web)/'
          - name: rendering
            exclude: '^(e2e|vendor|cmd)/|^internal/(api|apikey|auth|config|cron|db|duration|elevate|events|ids|models|notify|ping|prune|ratelimit|safego|scheduler|secret|server|store|testutil|tz|version)/'
          - name: rest
            exclude: '^(e2e|vendor)/|^internal/(assets|db|markdown|store|view|views|web)/'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `--diff` needs the base branch's history, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Gremlins derives each mutant's timeout from how long its coverage run
      # took. A cached test result makes that near zero, so nearly every mutant
      # "times out", which the efficacy score ignores: the job would pass
      # without testing anything.
      - run: go clean -testcache
      - name: Mutate the shard (push)
        if: github.event_name != 'pull_request'
        env:
          # Without a limit, gremlins runs one worker per CPU and each `go test`
          # uses every CPU, which got the runner SIGTERMed (exit 143).
          GOMAXPROCS: 2
          SHARD_EXCLUDE: ${{ matrix.shard.exclude }}
        run: |
          # A mutant can turn a loop into one that never ends and keeps
          # allocating. Memory ran out before gremlins' timeout fired and the
          # runner was killed with SIGTERM (exit 143). The address-space limit
          # makes such a test process crash instead, which counts as a killed
          # mutant.
          ulimit -v 4194304
          set -o pipefail
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            --workers 2 --exclude-files "$SHARD_EXCLUDE" . 2>&1 | tee "$RUNNER_TEMP/mutation.log"
      - name: Mutate the changed lines of the shard (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GOMAXPROCS: 2
          SHARD_EXCLUDE: ${{ matrix.shard.exclude }}
        run: |
          # Stream the output so a killed runner still leaves a log. Two
          # workers with GOMAXPROCS=2 keep a whole-module diff within the
          # runner's memory. Do not pass `--test-cpu`: gremlins v0.6.0 builds
          # the single argument `-cpu 2`, `go test` rejects it, and every
          # mutant then counts as killed.
          status=0
          ulimit -v 4194304 # see the push step
          set -o pipefail
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            --workers 2 --exclude-files "$SHARD_EXCLUDE" \
            --diff "origin/$BASE_REF" . 2>&1 | tee "$RUNNER_TEMP/mutation.log" || status=$?
          set +o pipefail
          # A shard whose diff has no mutable Go line (docs, CI only, or other
          # shards' files) yields zero mutants, which gremlins scores as 0% and
          # so fails the threshold. That is not a low score, so treat it as a
          # pass.
          if [ "$status" -ne 0 ] \
            && grep -q '^Killed: 0, Lived: 0, Not covered: 0$' "$RUNNER_TEMP/mutation.log" \
            && grep -q '^Timed out: 0, ' "$RUNNER_TEMP/mutation.log"; then
            echo "No mutants in the changed lines; nothing to test."
            exit 0
          fi
          exit "$status"

  # The one required check: branch protection names `mutation`, so shards can
  # be added or renamed without touching it. `always()` makes it run (and fail)
  # when a shard fails or is cancelled instead of being skipped.
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    needs: mutation-shard
    if: always()
    steps:
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.mutation-shard.result }}
        run: |
          echo "mutation shards: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = success ]

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.30.3
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Wait for mailpit
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8025/readyz && exit 0
            sleep 1
          done
          echo "mailpit did not become ready" >&2
          exit 1

      # `-coverprofile` ignores the binary cmd/pingward's TestMain execs; with
      # PINGWARD_COVERDIR set it builds that binary with `-cover`.
      - name: Generate coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PINGWARD_TEST_SMTP_HOST: localhost
          PINGWARD_TEST_SMTP_PORT: "1025"
          PINGWARD_TEST_MAILPIT_API: http://localhost:8025
        run: |
          mkdir -p "$PWD/covdata"
          PINGWARD_COVERDIR="$PWD/covdata" go test -mod=vendor -coverpkg=./... -coverprofile=coverage.out ./...
          go tool covdata textfmt -i=covdata -o coverage-bin.out
          tail -n +2 coverage-bin.out >> coverage.out
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henry40408/pingward
          files: coverage.out
          # Dependabot PRs cannot read repository secrets.
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  # Scenarios are split by hash (see `e2e/internal/harness/shard.go`), and each
  # shard runs its share. A shard that selects no scenarios fails, so a bad
  # split cannot pass by skipping tests.
  e2e:
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so the VCS-stamped version resolves
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Prebuild the server the suite launches, keeping the compile off its
      # timeout.
      - run: go build -mod=vendor -o bin/pingward ./cmd/pingward
      # The runner ships Chrome; chromedp starts it itself, so no driver is
      # needed. Pinned, because chromedp's own search would pick the runner's
      # Chromium snapshot ahead of google-chrome.
      - run: google-chrome --version
      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_CHROME: /usr/bin/google-chrome
          E2E_SHARD: ${{ matrix.shard }}
        run: go test -mod=vendor -count=1 -timeout 25m .

  lint-workflow:
    name: lint-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-action has no actionlint manifest, so download the release and
      # verify its checksum.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
      - run: ./actionlint
