version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns:
          - "*"

  # `e2e/` is a separate module; the root gomod entry doesn't reach its go.mod.
  - package-ecosystem: "gomod"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns:
          - "*"
